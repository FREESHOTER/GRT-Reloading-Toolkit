name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: tests
    # The shared library and the ladder tests are plain net8.0, so they run anywhere.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Build GrtPluginKit
        run: dotnet build grt-plugins-shared/GrtPluginKit/GrtPluginKit.csproj -c Release --nologo
      - name: Test
        run: dotnet test GrtReloadingToolkit.Tests/GrtReloadingToolkit.Tests.csproj -c Release --nologo

  plugin:
    name: plugin build
    # The plugin is net8.0-windows and needs the Windows Desktop SDK, which only the
    # Windows runner has. Build only — the forms cannot be exercised headlessly.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Build plugin
        run: dotnet build GrtReloadingToolkit/GrtReloadingToolkit.csproj -c Release --nologo
      # The csproj's plugin\**\* item has to land in the output under plugin\, because that is the
      # folder build-plugin.ps1's Assemble deletes before copying in the stamped manifest. Item
      # metadata can relocate it silently — a Link, a LinkBase that actually takes effect, or the
      # item moving into an imported .props — and the build still succeeds, so the packaging
      # breaks with nothing failing. This runner is the only place that layout is observable on
      # Windows, so assert it here rather than infer it.
      - name: Check plugin payload layout
        shell: pwsh
        run: |
          $out = "GrtReloadingToolkit/bin/Release/net8.0-windows"
          Write-Host "==> directories in the build output:"
          Get-ChildItem $out -Directory | ForEach-Object { Write-Host "      $($_.Name)\" }
          foreach ($f in @("plugin\com.grt.plugin.xml", "plugin\media\icons\icn_toolkit_16x16.png")) {
            if (-not (Test-Path (Join-Path $out $f))) { throw "missing from the build output: $f" }
            Write-Host "      ok: $f"
          }
          $stray = Get-ChildItem $out -Recurse -Directory -Filter "_plugin_template"
          if ($stray) { throw "_plugin_template in the build output ($($stray[0].FullName)); Assemble strips 'plugin', so the payload would ship twice" }
          Write-Host "==> payload is under plugin\, and there is no _plugin_template"
      # build-plugin.ps1 is the only way the shipped plugin folder gets built, and issues #10, #12
      # and #22 were all bugs in it that nothing here had ever caught - "Build plugin" above only
      # runs `dotnet build`, never the packaging script itself. This has to be Windows PowerShell
      # 5.1 (`powershell`), not `pwsh` (PowerShell 7): #10 was specifically a 5.1 parse failure
      # from decoding a BOM-less .ps1 as the system ANSI code page, which pwsh's UTF-8 assumption
      # would not reproduce - the same reason ScriptEncodingTests can catch the byte pattern but
      # not the actual parse failure a real 5.1 host hits.
      - name: Run build-plugin.ps1 (Windows PowerShell 5.1)
        shell: powershell
        run: |
          .\GrtReloadingToolkit\build-plugin.ps1 -Zip
      # A regressed em dash or a missing -Encoding on Get-Content wouldn't necessarily make the
      # script fail outright (issue #22's bug corrupted the manifest text silently rather than
      # throwing) - so this checks the packaged output too, not just the script's exit code.
      - name: Verify packaged plugin
        shell: pwsh
        run: |
          foreach ($f in @(
            "GrtReloadingToolkit\dist\ReloadingToolkit\GRT_Reloading_Toolkit.exe",
            "GrtReloadingToolkit\dist\ReloadingToolkit\com.grt.plugin.xml",
            "GrtReloadingToolkit\dist\ReloadingToolkit.zip",
            "GrtReloadingToolkit\dist\ReloadingToolkit-lite\GRT_Reloading_Toolkit.exe",
            "GrtReloadingToolkit\dist\ReloadingToolkit-lite.zip"
          )) {
            if (-not (Test-Path $f)) { throw "missing packaged artifact: $f" }
            Write-Host "      ok: $f"
          }
          $manifest = Get-Content "GrtReloadingToolkit\dist\ReloadingToolkit\com.grt.plugin.xml" -Raw -Encoding UTF8
          $ellipsis = [char]0x2026
          if ($manifest -notmatch [regex]::Escape("Reloading Toolkit$ellipsis")) {
            throw "packaged manifest's menu label lost its ellipsis - issue #22's ANSI/UTF-8 mojibake bug is back"
          }
          Write-Host "==> packaged plugin is complete and the manifest text is intact"
      # "Verify packaged plugin" above proves the zips exist, but a zip can exist and still be
      # broken: Windows PowerShell 5.1's Compress-Archive writes entry paths with backslashes,
      # which violates ZIP APPNOTE 4.4.17.1 (entry paths are always forward-slashed). Windows
      # Explorer unpacks those anyway, so the damage is invisible here - but macOS and Linux
      # unzip treats the backslash as part of the filename and drops the whole tree into one
      # flat folder of files literally named "ReloadingToolkit\media\icons\...". That is why
      # build-plugin.ps1 has its own WriteZip instead of calling Compress-Archive; this asserts
      # nobody swaps it back. WriteZip runs only under -Zip, and the zip is written successfully
      # either way, so the script exits 0 in both cases - the artifact has to be inspected.
      - name: Check zip entry paths use forward slashes
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($name in @("ReloadingToolkit.zip", "ReloadingToolkit-lite.zip")) {
            $path = "GrtReloadingToolkit\dist\$name"
            $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $path))
            try {
              $bad = $zip.Entries | Where-Object { $_.FullName -match '\\' } | Select-Object -First 1
              if ($bad) { throw "$name has a backslash entry path ($($bad.FullName)) - it will not unpack as a folder off Windows (ZIP APPNOTE 4.4.17.1)" }
              Write-Host "      ok: $name ($($zip.Entries.Count) entries, all forward-slashed)"
            } finally { $zip.Dispose() }
          }
          Write-Host "==> both zips unpack as folders on every platform"
